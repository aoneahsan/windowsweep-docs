# ──────────────────────────────────────────────────────────────────────────
# Deploy this Docusaurus docs site to GitHub Pages on every push to main.
#
# The canonical docs-site workflow — see ~/.claude/rules/docs-sites.md.
# Docs sites deploy to GitHub Pages ONLY; they never get a Firebase project.
#
# Uses the official Pages flow (upload-pages-artifact + deploy-pages), so there
# is no gh-pages branch to maintain. The custom domain is pinned by static/CNAME,
# which Docusaurus copies verbatim into build/ — so build/CNAME ships inside the
# artifact automatically and needs no extra step.
#
# Optional analytics keys come from repo Actions secrets; when a secret is unset
# the corresponding provider is skipped entirely, so the build never depends on
# one. NO secret is ever committed to this repo — it is public.
#
# Owner-only setup (docs/MANUAL-TASKS.md): the Hostinger DNS CNAME record
# pointing windowsweep-docs.aoneahsan.com at aoneahsan.github.io, and repo
# Settings → Pages → custom domain + Enforce HTTPS.
# ──────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token + the id-token that deploy-pages requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so showLastUpdateTime is accurate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        # Respects the `packageManager` pin in package.json. Do NOT add
        # `corepack prepare yarn@stable --activate` — it installs a NEWER Yarn
        # than the one that produced yarn.lock, which re-hashes entries and
        # makes `yarn install --immutable` fail with YN0028.
        run: |
          corepack enable
          yarn --version

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          # All optional — an absent secret skips that provider.
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: No owner-only files in the build
        # docs/MANUAL-TASKS.md lives inside the published content directory, so the docusaurus `exclude`
        # is the only thing keeping it off a PUBLIC site. This is the second line of defence.
        # docs/story/** (the Story Bible, voice fingerprint, content map, decision log and drafts)
        # is excluded the same way and swept for here too - proved on 2026-09-05 by planting a
        # story-bible.html in a fake build: the old expression missed it, this one catches it.
        # The non-empty check matters: `find` over a missing directory prints nothing, so a bare
        # `test -z` would pass on a build that never happened.
        run: |
          test -d build || { echo "build/ is missing - this check would pass vacuously"; exit 1; }
          test "$(find build -type f | wc -l)" -gt 20 || { echo "build/ has too few files to trust"; exit 1; }
          hits="$(find build -iname '*MANUAL*' -o -iname '*story-bible*' -o -iname '*decision-log*' -o -iname '*run-state*' -o -iname '*voice-fingerprint*' -o -iname '*content-map*')"
          if [ -n "$hits" ]; then echo "owner-only file(s) reached the build:"; echo "$hits"; exit 1; fi
          echo "no owner-only files in $(find build -type f | wc -l) built files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
